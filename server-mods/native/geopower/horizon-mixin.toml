# GeoPower: generators that make power (FE) from the world around them. A native trait mod
# (docs/native-mods.md, "Trait mods"): the Rust package in api/ implements horizon_client's
# mod_api::Hooks. It runs on the server only. The blocks themselves, their look, recipes and names
# are the content mod server-mods/content/geopower, which players install too.
#
# It uses only catalog hooks and Host helpers, so it builds on later Horizons without a pin.
[mod]
id = "geopower"
version = "0.1.0"

[api]
path = "api"
